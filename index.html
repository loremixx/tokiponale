        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--tx);touch-action:manipulation;min-height:100dvh;user-select:none}
        ::-webkit-scrollbar{width:3px}
        ::-webkit-scrollbar-thumb{background:var(--bd);border-radius:99px}
        @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pop{0%,100%{transform:scale(1)}45%{transform:scale(1.2)}}
        @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
        @keyframes ping{0%{transform:scale(1);opacity:1}100%{transform:scale(1.7);opacity:0}}

        .ap{animation:pop .4s ease}
        .as{animation:shake .4s ease}

        .br{background:var(--rd);color:#fff}
        .bt{background:var(--tl);color:#fff}

        .sinput:focus{border-color:var(--ac)}
        .sinput::placeholder{color:var(--tx2)}
        /* Word tiles for sentence builder */
        .tile{padding:10px 16px;border-radius:10px;border:2px solid var(--bd);background:var(--sf);cursor:pointer;font-family:'Lora',serif;font-size:16px;font-weight:700;color:var(--tx);transition:border-color .15s,background .15s,transform .1s,opacity .15s}

        .tile.used{opacity:.25;cursor:default;transform:none}
        .tile.placed{background:var(--bl2);border-color:var(--bl)}
        .tile.placed:active{transform:scale(.97)}

        .slot-area{min-height:56px;border:2px dashed var(--bd);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;transition:border-color .3s}
        .slot-area.has-content{border-color:var(--ac);border-style:solid}
        .slot-area.correct{border-color:var(--gn);background:var(--gn2)}
        .slot-area.wrong{border-color:var(--rd);background:var(--rd2)}
        /* MCQ options */
        .mopt{background:var(--sf);border:2px solid var(--bd);border-radius:13px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;text-align:left;width:100%}
        .mopt:active{transform:scale(.98)}
        .mopt.sel{border-color:var(--bl);background:var(--bl2)}
        .mopt.cor{border-color:var(--gn);background:var(--gn2)}
        .mopt.wrg{border-color:var(--rd);background:var(--rd2)}
        /* Card grid opts */
        .gopt{background:var(--sf);border:2px solid var(--bd);border-radius:13px;padding:15px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
        .gopt:active{transform:scale(.95)}
        .gopt.sel{border-color:var(--bl);background:var(--bl2)}
        .gopt.cor{border-color:var(--gn);background:var(--gn2)}
        .gopt.wrg{border-color:var(--rd);background:var(--rd2)}
        /* Nav */
        .bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--sf);border-top:1.5px solid var(--bd);z-index:50}
        .nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 14px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);border:none;background:none;cursor:pointer;transition:color .2s}
        .nb.active{color:var(--ac)}
        .hdr{padding:14px 16px 12px;background:var(--sf);border-bottom:1.5px solid var(--bd);position:sticky;top:0;z-index:20}
        .card{background:var(--sf);border:1.5px solid var(--bd);border-radius:14px;padding:16px}
        .ex-row{padding:10px 12px;border-radius:10px;background:var(--sf2);margin-bottom:8px}
        .lbl{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.09em}
        .gram-item{background:var(--sf);border:1.5px solid var(--bd);border-radius:13px;overflow:hidden}
        .gram-hdr{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
        .gram-body{padding:13px 15px;border-top:1.5px solid var(--bd)}
        .srs-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

</head>

/* ═══════════════════════════════════════════════════════
   SRS — Spaced Repetition System
   Her kelime için: {interval, ease, nextReview, errors}
   SM-2 benzeri basit versiyon
═══════════════════════════════════════════════════════ */
const SRS_INTERVALS = [1, 3, 7, 14, 30, 60]; // days
function srsUpdate(card, correct) {
    const now = Date.now();
    if (!correct) {
        return { ...card, interval: 0, errors: (card.errors||0)+1, nextReview: now + 60*1000 }; // retry in 1 min
    }
    const idx = Math.min((card.interval||0) + 1, SRS_INTERVALS.length - 1);
    return { ...card, interval: idx, errors: card.errors||0,
        nextReview: now + SRS_INTERVALS[idx] * 24*60*60*1000 };
}
function isDue(card) {
    return !card.nextReview || Date.now() >= card.nextReview;
}
function daysUntil(ts) {
    if (!ts) return 0;
    const ms = ts - Date.now();
    if (ms <= 0) return 0;
    return Math.ceil(ms / (24*60*60*1000));
}

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
const shuffle = a => [...a].sort(()=>Math.random()-.5);
const wFind = key => WORDS.find(w=>w.w===key);

function buildSessionQueue(unit, srsCards, allLearned) {
    // srsCards: {wordKey: {interval, nextReview, errors}}
    const queue = [];
    const unitWords = unit.wk.map(wFind).filter(Boolean);

    // 1. New words (not yet learned, up to 5 per session)
    const newWords = unitWords.filter(w => !allLearned.includes(w.w)).slice(0, 5);

    // 2. Due reviews from this unit
    const due = unitWords
        .filter(w => allLearned.includes(w.w) && srsCards[w.w] && isDue(srsCards[w.w]))
        .slice(0, 8);

    // 3. Error words (highest error count first)
    const errWords = unitWords
        .filter(w => allLearned.includes(w.w) && (srsCards[w.w]?.errors||0) > 0)
        .sort((a,b)=>(srsCards[b.w]?.errors||0)-(srsCards[a.w]?.errors||0))
        .slice(0, 3);

    // Build: for each new word → teach → quiz immediately → sentence (if available)
    newWords.forEach(word => {
        queue.push({ type:'teach', word });
        // quiz: pick TP from Turkish (no translations on options)
        const d = shuffle(WORDS.filter(w=>w.w!==word.w)).slice(0,3);
        queue.push({ type:'pick_tp', word, prompt:word.m, correct:word.w, options:shuffle([word,...d]) });
        // quiz: pick Turkish from TP
        const d2 = shuffle(WORDS.filter(w=>w.w!==word.w)).slice(0,3);
        queue.push({ type:'pick_tr', word, prompt:word.w, correct:word.m,
            options:shuffle([{k:word.w,l:word.m},...d2.map(x=>({k:x.w,l:x.m}))]) });
    });

    // Sentence exercises for this unit
    const sentenceIds = unit.sx || [];
    const sentences = shuffle(sentenceIds.map(id=>SENTENCES.find(s=>s.id===id)).filter(Boolean)).slice(0,4);
    sentences.forEach(s => queue.push({ type:'sentence', sentence:s }));

    // Reviews and error words → quiz only
    shuffle([...new Set([...due, ...errWords])]).forEach(word => {
        const d = shuffle(WORDS.filter(w=>w.w!==word.w)).slice(0,3);
        queue.push({ type:'pick_tp', word, prompt:word.m, correct:word.w, options:shuffle([word,...d]), isReview:true });
    });

    // Final mixed sentence round if new words exist
    if (newWords.length > 0 && sentences.length > 0) {
        const extra = shuffle(sentences).slice(0,2);
        extra.forEach(s => queue.push({ type:'sentence', sentence:s, isRepeat:true }));
    }

    return queue;
}

// 5. SENTENCE BUILDER (word bank tiles)
function BuildCard({ card, idx, total, hearts, color, status, onCheck, onNext }) {
    const sentence = card.sentence;
    const answer = sentence.answer;
    const [placed, setPlaced] = useState([]); // words placed by user
    const [bank, setBank] = useState([]); // available tiles with ids
    const slotRef = useRef(null);

    useEffect(()=>{
        // Create shuffled bank: correct answer words + 2-3 distractors
        const distract = shuffle(WORDS.filter(w=>!answer.includes(w.w))).slice(0,Math.min(3, answer.length+1)).map(w=>w.w);
        const allTiles = shuffle([...answer, ...distract]).map((w,i)=>({id:i,word:w}));
        setBank(allTiles);
        setPlaced([]);
    }, [card]);

    const placeTile = (tile) => {
        if(status!=='idle') return;
        setPlaced(p=>[...p, tile]);
        setBank(b=>b.map(t=>t.id===tile.id?{...t,used:true}:t));
    };
    const removePlaced = (tile) => {
        if(status!=='idle') return;
        setPlaced(p=>p.filter(t=>t.id!==tile.id));
        setBank(b=>b.map(t=>t.id===tile.id?{...t,used:false}:t));
    };

    const placedWords = placed.map(t=>t.word);
    const isCorrect = JSON.stringify(placedWords)===JSON.stringify(answer);

    const slotCls = placed.length>0 ? (status==='idle'?'has-content':status==='correct'?'correct':'wrong') : '';

    return (
        <div style={{maxWidth:480,margin:'0 auto',minHeight:'100dvh',background:'var(--bg)',display:'flex',flexDirection:'column'}}>
            <LessonHeader idx={idx} total={total} hearts={hearts} onQuit={()=>onNext('quit')} color={color} />
            <div style={{flex:1,padding:'22px 16px 0',overflowY:'auto'}}>
                <div className="lbl" style={{marginBottom:10}}>Cümleyi Türkçe'den Toki Pona'ya çevir</div>
                <div style={{fontFamily:"'Lora',serif",fontWeight:700,fontSize:22,color:'var(--tx)',marginBottom:4,lineHeight:1.35}}>{sentence.tr}</div>
                {sentence.hint&&<div style={{fontSize:12,color:'var(--tx2)',fontStyle:'italic',marginBottom:16}}>💡 {sentence.hint}</div>}
                {!sentence.hint&&<div style={{marginBottom:16}}/>}

                {/* Answer slot */}
                <div className={`slot-area ${slotCls}`} ref={slotRef} onClick={e=>{ if(e.target===slotRef.current&&placed.length>0) removePlaced(placed[placed.length-1]); }}>
                    {placed.length===0&&<span style={{color:'var(--tx2)',fontSize:13}}>Kelimelere dokun…</span>}
                    {placed.map(tile=>(
                        <span key={tile.id} className="tile placed" onClick={()=>removePlaced(tile)}
                            style={{fontFamily:"'Lora',serif",fontWeight:700,fontSize:16,color:status==='correct'?'var(--gn)':status==='wrong'?'var(--rd)':'var(--tx)'}}>
                            {tile.word}
                        </span>
                    ))}
                </div>
                {status!=='idle'&&(
                    <div className="au" style={{marginTop:8,fontSize:13,color:'var(--ac)',fontFamily:"'Lora',serif",fontWeight:600}}>

                    {bank.map(tile=>(
                        <button key={tile.id} className={`tile ${tile.used?'used':''}`} onClick={()=>!tile.used&&placeTile(tile)}
                            style={{fontFamily:"'Lora',serif",fontWeight:700,fontSize:16,opacity:tile.used?.25:1}}>
                            {tile.word}
                        </button>
                    ))}
                </div>
            </div>
            <FeedbackBar status={status} correctLabel={answer.join(' ')} hearts={hearts}
                onAction={()=>{
                    if(status==='idle'){ if(placed.length===0)return; onCheck(isCorrect); }
                    else onNext(status);
                }} />
        </div>
    );
}

/* ═══════════════════════════════════════════════════════
   LESSON MANAGER
═══════════════════════════════════════════════════════ */
function LessonView({ unit, appState, onFinish }) {
    const queue = useRef(buildSessionQueue(unit, appState.srs, appState.learned)).current;
    const [idx, setIdx] = useState(0);
    const [hearts, setHearts] = useState(5);
    const [status, setStatus] = useState('idle');
    const [gained, setGained] = useState({ newWords:[], srsUpdates:{} });

    const card = queue[idx];
    if (!card) { onFinish(gained, true); return null; }

    const advance = useCallback((result) => {
        if(result==='quit'){ onFinish(gained, false); return; }
        // Track newly learned words from teach cards
        if(card.type==='teach'){
            setGained(g=>({...g, newWords:[...new Set([...g.newWords,card.word.w])]}));
        }
        if(idx < queue.length-1){ setIdx(i=>i+1); setStatus('idle'); }
        else onFinish(gained, true);
    }, [idx, card, gained, queue, onFinish]);

    const handleCheck = useCallback((correct) => {
        setStatus(correct ? 'correct' : 'wrong');
        if(!correct) setHearts(h=>Math.max(0,h-1));
        // SRS update for quiz cards
        if(card.word){
            setGained(g=>({
                ...g,
                srsUpdates:{
                    ...g.srsUpdates,
                    [card.word.w]: srsUpdate(appState.srs[card.word.w]||{}, correct)
                }
            }));
        }
    }, [card, appState.srs]);

    const commonProps = { idx, total:queue.length, hearts, color:unit.color, status,
        onCheck:handleCheck, onNext:advance };

    if(card.type==='teach') return <TeachCard word={card.word} onNext={()=>advance('next')} />;
    if(card.type==='pick_tp') return <PickTpCard card={card} {...commonProps} />;
    if(card.type==='pick_tr') return <PickTrCard card={card} {...commonProps} />;
    if(card.type==='sentence'){
        const s = card.sentence;
        if(s.type==='fill') return <FillCard card={s} {...commonProps} />;
        if(s.type==='build') return <BuildCard card={card} {...commonProps} />;
    }
    // fallback
    return <PickTpCard card={card} {...commonProps} />;
}

/* ═══════════════════════════════════════════════════════
   REVIEW SESSION (spaced repetition due cards)
═══════════════════════════════════════════════════════ */
function buildReviewQueue(srsCards, learned) {
    const due = learned.filter(w => srsCards[w] && isDue(srsCards[w]));
    const sorted = due.sort((a,b)=>(srsCards[a]?.errors||0)-(srsCards[b]?.errors||0));
    const toReview = sorted.slice(0, 15);
    const queue = [];
    toReview.forEach(key => {
        const word = wFind(key);
        if(!word) return;
        const d = shuffle(WORDS.filter(w=>w.w!==key)).slice(0,3);
        queue.push({ type:'pick_tp', word, prompt:word.m, correct:word.w, options:shuffle([word,...d]), isReview:true });
        if(Math.random() > 0.4) {
            const d2 = shuffle(WORDS.filter(w=>w.w!==key)).slice(0,3);
            queue.push({ type:'pick_tr', word, prompt:word.w, correct:word.m,
                options:shuffle([{k:key,l:word.m},...d2.map(x=>({k:x.w,l:x.m}))]), isReview:true });
        }
    });
    // Add some sentence exercises too
    const dueSentences = shuffle(SENTENCES.filter(s => {
        const wordsInSentence = s.type==='build'? s.answer : s.sentence;
        return wordsInSentence.some(w=>due.includes(w));
    })).slice(0,4);
    dueSentences.forEach(s=>queue.push({type:'sentence',sentence:s}));
    return shuffle(queue);
}

function ReviewView({ appState, onFinish }) {
    const queue = useRef(buildReviewQueue(appState.srs, appState.learned)).current;
    const [idx, setIdx] = useState(0);
    const [hearts, setHearts] = useState(5);
    const [status, setStatus] = useState('idle');
    const [updates, setUpdates] = useState({});

    if(queue.length===0){
        return (
            <div style={{minHeight:'100dvh',background:'var(--bg)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,textAlign:'center'}}>
                <div style={{fontSize:64,marginBottom:16}}>✨</div>
                <div style={{fontFamily:"'Lora',serif",fontWeight:700,fontSize:24,color:'var(--ac)',marginBottom:8}}>Tekrar Yok!</div>
                <div style={{color:'var(--tx2)',fontSize:14,marginBottom:28,lineHeight:1.6}}>Bugün tekrar edilecek kelime yok. Yeni bir ünite başla veya yarın tekrar gel!</div>
                <button className="btn ba" style={{maxWidth:280}} onClick={()=>onFinish({},false)}>Geri Dön</button>
            </div>
        );
    }

    const card = queue[idx];
    if(!card){ onFinish(updates, true); return null; }

    const advance = useCallback((result) => {
        if(result==='quit'){ onFinish(updates,false); return; }
        if(idx < queue.length-1){ setIdx(i=>i+1); setStatus('idle'); }
        else onFinish(updates, true);
    },[idx,updates,queue,onFinish]);

    const handleCheck = useCallback((correct) => {
        setStatus(correct?'correct':'wrong');
        if(!correct) setHearts(h=>Math.max(0,h-1));
        if(card.word) setUpdates(u=>({...u,[card.word.w]:srsUpdate(appState.srs[card.word.w]||{},correct)}));
    },[card,appState.srs]);

    const cp = {idx,total:queue.length,hearts,color:'var(--tl)',status,onCheck:handleCheck,onNext:advance};

    if(card.type==='pick_tp') return <PickTpCard card={card} {...cp} />;
    if(card.type==='pick_tr') return <PickTrCard card={card} {...cp} />;
    if(card.type==='sentence'){
        const s=card.sentence;
        if(s.type==='fill') return <FillCard card={s} {...cp} />;
        if(s.type==='build') return <BuildCard card={card} {...cp} />;
    }
    return <PickTpCard card={card} {...cp} />;
}

/* ═══════════════════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════════════════ */
function App() {
    const [appState, setAppState] = useState(loadState);
    const [view, setView] = useState('map');
    const [mode, setMode] = useState(null); // 'lesson' | 'review'
    const [activeUnit, setActiveUnit] = useState(null);
    const [summary, setSummary] = useState(null);

    useEffect(()=>saveState(appState), [appState]);

    const dueCount = useMemo(()=>
        appState.learned.filter(w=>appState.srs[w]&&isDue(appState.srs[w])).length,
        [appState]);

    const mergeResults = useCallback((gained, srsUpdates) => {
        setAppState(prev => {
            const newLearned = [...new Set([...prev.learned, ...gained.newWords])];
            const newSrs = { ...prev.srs };
            // Apply SRS updates
            Object.entries({ ...(gained.srsUpdates||{}), ...srsUpdates }).forEach(([k,v])=>{ newSrs[k]=v; });
            // New words: initialize SRS
            gained.newWords.forEach(w => { if(!newSrs[w]) newSrs[w] = srsUpdate({},false); });
            return { ...prev, learned:newLearned, srs:newSrs, lastStudied: Date.now() };
        });
    }, []);

    const startLesson = useCallback((unitId) => {
        setActiveUnit(UNITS.find(u=>u.id===unitId));
        setMode('lesson'); setView('lesson');
    }, []);

    const startReview = useCallback(() => {
        setMode('review'); setView('lesson');
    }, []);

    const finishLesson = useCallback((gained, completed) => {
        mergeResults(gained, {});
        if(completed){
            setSummary({ unit:activeUnit, newCount:gained.newWords.length });
            setView('summary');
        } else setView('map');
    }, [activeUnit, mergeResults]);

    const finishReview = useCallback((updates, completed) => {
        setAppState(prev=>{
            const newSrs={...prev.srs};
            Object.entries(updates).forEach(([k,v])=>newSrs[k]=v);
            return {...prev,srs:newSrs};
        });
        setView('review');
    }, []);

    if(view==='lesson'){
        if(mode==='lesson'&&activeUnit) return <LessonView unit={activeUnit} appState={appState} onFinish={finishLesson} />;
        if(mode==='review') return <ReviewView appState={appState} onFinish={finishReview} />;
    }
    if(view==='summary'&&summary){
        return <SummaryView unit={summary.unit} newCount={summary.newCount} onContinue={()=>setView('map')} />;
    }

    return (
        <div>
            {view==='map'    && <MapView appState={appState} startLesson={startLesson} />}
            {view==='review' && <ReviewDashboard appState={appState} startReview={startReview} />}
            {view==='dict'   && <DictView appState={appState} />}
            <BottomNav active={view} setView={setView} dueCount={dueCount} />
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
